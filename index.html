<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樂團課程簽到系統 V3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#182536;--cream:#f6f3ed;--card:#fff;--line:#ddd8cf;--gold:#b18b52;--green:#557a64;--yellow:#b88938;--red:#a75a52;--muted:#777}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:#26303a}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.header{background:var(--navy);color:white;padding:17px 22px;position:sticky;top:0;z-index:20}.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:Georgia,serif;font-size:21px;letter-spacing:1px}.sub{font-size:12px;color:#cbd1d8;margin-top:4px}.header-actions{display:flex;gap:8px}
.admin-btn,.ghost-light{background:#fff;color:var(--navy);padding:9px 13px;border-radius:8px;font-size:13px}.ghost-light{background:transparent;color:white;border:1px solid #ffffff55}
.container{max-width:1100px;margin:0 auto;padding:24px 18px 60px}.top{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 12px #00000009}
.date-row{display:flex;align-items:center;gap:10px}.date-row h1{margin:0;font-size:26px}.date-select,.field{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:white;width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:13px 8px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.num{font-size:23px;font-weight:700}.label{font-size:12px;color:var(--muted);margin-top:4px}
.progress{height:7px;background:#e8e4dc;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:var(--green);width:0%;transition:.25s}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.section-title h2{font-size:18px;margin:0}.hint{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:#555}.filter.active{background:var(--navy);color:white}
.instrument{background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}.instrument-head{width:100%;padding:15px 16px;background:white;display:flex;align-items:center;justify-content:space-between;text-align:left}.instrument-head:hover{background:#faf9f6}.inst-left{display:flex;align-items:center;gap:12px}.chev{font-size:18px;color:var(--muted);width:18px}.inst-name{font-weight:650}.count{font-size:12px;color:var(--muted)}
.people{padding:4px 12px 12px;border-top:1px solid #eee}.person{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:11px 4px;border-bottom:1px solid #eee}.person:last-child{border-bottom:0}.name{font-size:15px}.role{font-size:11px;color:var(--muted);margin-left:7px}
.att-box{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;color:#777}.att-box input{appearance:none;width:24px;height:24px;border:2px solid #ccc;border-radius:6px;background:white;margin:0;cursor:pointer}.att-box input:checked{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px white}.att-box.leave-box input:checked{background:var(--yellow);border-color:var(--yellow)}
.note{grid-column:1/-1;color:#806d50;font-size:12px;background:#faf6ed;padding:7px 9px;border-radius:7px}
.small-btn{padding:6px 9px;border-radius:7px;background:#eee;color:#555;font-size:12px}.danger{color:var(--red)}.primary{background:var(--navy);color:white;padding:9px 13px;border-radius:8px}.success{background:var(--green);color:white;padding:9px 13px;border-radius:8px}
.empty{padding:18px;color:#999;font-size:13px;text-align:center}.loading{padding:30px;text-align:center;color:#888}
#admin{display:none}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.admin-page{margin-top:18px}.admin-list{max-height:520px;overflow:auto}.admin-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;gap:10px}.add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.add-row .field{flex:1;min-width:130px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.table-wrap{overflow:auto}.stats-table{width:100%;border-collapse:collapse;font-size:13px}.stats-table th,.stats-table td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.stats-table th{color:#666;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:40;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:white;border-radius:14px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}.modal-box h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.error{color:var(--red);font-size:12px;margin-top:8px}.success-msg{color:var(--green);font-size:12px;margin-top:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:10px 16px;border-radius:9px;display:none;z-index:60;font-size:13px}.toast.show{display:block}
@media(max-width:760px){.top,.admin-grid,.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:10px 3px}.num{font-size:19px}.container{padding:18px 12px 45px}.header{padding:14px}.brand{font-size:18px}.date-row{align-items:flex-start;flex-direction:column}.date-select{width:100%}.person{grid-template-columns:1fr auto auto}.person>.small-btn{grid-column:3}.header-actions .ghost-light{display:none}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
<div><div class="brand">ORCHESTRA ATTENDANCE</div><div class="sub">樂團課程簽到系統 · V3 雲端版</div></div>
<div class="header-actions"><button class="ghost-light" id="adminUserLabel" style="display:none" onclick="logout()">登出</button><button class="admin-btn" id="adminBtn" onclick="openLogin()">🔒 管理模式</button></div>
</div></header>

<main class="container" id="main">
<div class="top">
<div class="panel">
<div class="date-row"><div style="min-width:115px"><div class="sub" style="color:#777">本次課程</div><h1 id="dateTitle">載入中</h1></div>
<select class="date-select" id="dateSelect" onchange="changeDate(this.value)"></select></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>
<div class="panel"><div class="stats">
<div class="stat"><div class="num" id="presentN">0</div><div class="label">已到</div></div>
<div class="stat"><div class="num" id="leaveN">0</div><div class="label">請假</div></div>
<div class="stat"><div class="num" id="absentN">0</div><div class="label">未簽到</div></div>
<div class="stat"><div class="num" id="rateN">0%</div><div class="label">出席率</div></div>
</div></div>
</div>
<div class="section-title"><h2>今日簽到</h2><span class="hint">點開樂器後找到自己的名字</span></div>
<div class="toolbar" id="roleFilters">
<button class="filter active" onclick="setRole('all',this)">全部</button><button class="filter" onclick="setRole('學員',this)">學員</button><button class="filter" onclick="setRole('聯演老師',this)">聯演老師</button><button class="filter" onclick="setRole('駐團老師',this)">駐團老師</button>
</div>
<div id="instruments"><div class="loading">正在載入名單……</div></div>
</main>

<main class="container" id="admin">
<div class="section-title"><h2>管理模式</h2><button class="small-btn" onclick="showMain()">返回簽到</button></div>
<div class="toolbar admin-tabs">
<button class="filter active" onclick="adminTab('courses',this)">📅 課程管理</button>
<button class="filter" onclick="adminTab('people',this)">👥 人員管理</button>
<button class="filter" onclick="adminTab('stats',this)">📊 出席統計</button>
</div>
<div id="adminCourses" class="admin-page">
<div class="admin-grid">
<div class="panel"><h3>課程日期</h3><div id="dateAdmin" class="admin-list"></div>
<div class="add-row"><input class="field" id="newDate" placeholder="例如 1/20"><button class="primary" onclick="addDate()">新增日期</button></div></div>
<div class="panel"><h3>同步狀態</h3><p style="font-size:13px;line-height:1.7;color:#666">資料現在儲存在 Supabase 雲端資料庫。管理者可在不同裝置登入同一個管理帳號查看同一份資料。</p><p id="syncStatus" style="font-size:12px;color:var(--green)">已連線</p></div>
</div></div>
<div id="adminPeople" class="admin-page" style="display:none">
<div class="panel"><h3>新增人員</h3>
<div class="form-grid">
<input class="field" id="personName" placeholder="姓名">
<select class="field" id="personRole"><option>學員</option><option>聯演老師</option><option>駐團老師</option></select>
<select class="field" id="personGroup"></select>
<input class="field" id="personPart" placeholder="聲部（選填，例如 Cl.1）">
</div>
<div class="add-row"><button class="primary" onclick="addPerson()">＋新增人員</button></div>
<hr style="border:0;border-top:1px solid #eee;margin:18px 0">
<h3>現有人員</h3><p style="font-size:12px;color:#777">同一樂器內可用 ↑ ↓ 調整顯示順序。</p><div id="peopleAdmin" class="admin-list"></div>
</div></div>
<div id="adminStats" class="admin-page" style="display:none">
<div class="panel"><h3>各堂課出席統計</h3><div class="table-wrap"><div id="statsAdmin"></div></div></div>
</div>
</main>

<div class="modal" id="loginModal"><div class="modal-box">
<h3>管理員登入</h3><p style="font-size:13px;color:#777;margin-top:-4px">登入後可在不同裝置查看與管理雲端資料。</p>
<input id="loginEmail" class="field" type="email" placeholder="管理員 Email" autocomplete="username">
<input id="loginPassword" class="field" type="password" placeholder="管理員密碼" autocomplete="current-password" style="margin-top:9px" onkeydown="if(event.key==='Enter')login()">
<div id="loginError" class="error"></div>
<div class="modal-actions"><button class="small-btn" onclick="closeLogin()">取消</button><button class="primary" onclick="login()">登入</button></div>
</div></div>

<div class="modal" id="editModal"><div class="modal-box">
<h3>編輯人員</h3><input type="hidden" id="editId">
<input id="editName" class="field" placeholder="姓名">
<select id="editRole" class="field" style="margin-top:9px"><option>學員</option><option>聯演老師</option><option>駐團老師</option></select>
<select id="editGroup" class="field" style="margin-top:9px"></select>
<input id="editPart" class="field" placeholder="聲部（選填）" style="margin-top:9px">
<div class="modal-actions"><button class="small-btn" onclick="closeEdit()">取消</button><button class="primary" onclick="savePerson()">儲存</button></div>
</div></div>

<div class="modal" id="noteModal"><div class="modal-box">
<h3 id="noteTitle">特殊狀況備註</h3><textarea id="noteText" class="field" style="min-height:100px;resize:vertical" placeholder="例如：預計遲到 30 分鐘"></textarea>
<div class="modal-actions"><button class="small-btn" onclick="closeNote()">取消</button><button class="primary" onclick="saveNote()">儲存</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://tbfvggfsdloelspsqqlx.supabase.co";
const SUPABASE_KEY="sb_publishable_egHaaiyX45qSvApEO8_lwQ_u0l_9aew";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let courses=[], people=[], attendance={}, currentDateId=null, currentRole="all", noteTarget=null, refreshTimer=null, openGroups=new Set();
const instrumentOrder=["第一小提琴","第二小提琴","中提琴","大提琴","低音提琴","長笛","雙簧管","單簧管","低音管","法國號","小號","長號","低音號","打擊"];

function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("'","&#39;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
async function loadAll(){
 document.getElementById("syncStatus")?.replaceChildren();
 const [{data:c,error:ce},{data:p,error:pe}]=await Promise.all([
  sb.from("courses").select("*").order("sort_order").order("id"),
  sb.from("people").select("*").eq("active",true).order("instrument").order("sort_order",{ascending:true}).order("id")
 ]);
 if(ce||pe){console.error(ce||pe);document.getElementById("instruments").innerHTML='<div class="empty">資料載入失敗，請確認 Supabase 設定。</div>';return}
 courses=c||[];people=p||[];
 if(!currentDateId || !courses.some(x=>x.id===currentDateId)) currentDateId=courses[0]?.id||null;
 renderDateSelect(); await loadAttendance(); render();
}
async function loadAttendance(){
 if(!currentDateId){attendance={};return}
 const {data,error}=await sb.from("attendance").select("*").eq("course_id",currentDateId);
 if(error){console.error(error);return}
 attendance={};(data||[]).forEach(a=>attendance[a.person_id]=a);
}
function renderDateSelect(){
 const s=document.getElementById("dateSelect");s.innerHTML=courses.map(c=>`<option value="${c.id}">${esc(c.course_date)}</option>`).join("");if(currentDateId)s.value=currentDateId;
 document.getElementById("dateTitle").textContent=courses.find(c=>c.id===currentDateId)?.course_date||"尚無課程";
}
async function changeDate(id){currentDateId=Number(id);renderDateSelect();await loadAttendance();render()}
function getStatus(id){return attendance[id]?.status||"absent"}
function grouped(){
 let map={};instrumentOrder.forEach(g=>map[g]=[]);
 people.forEach(p=>{if(!map[p.instrument])map[p.instrument]=[];if(currentRole==="all"||p.role===currentRole)map[p.instrument].push(p)});return map;
}
function render(){
 let visible=people.filter(p=>currentRole==="all"||p.role===currentRole),total=visible.length,p=0,l=0;
 visible.forEach(x=>{if(getStatus(x.id)==="present")p++;if(getStatus(x.id)==="leave")l++});
 document.getElementById("presentN").textContent=p;document.getElementById("leaveN").textContent=l;document.getElementById("absentN").textContent=total-p-l;
 document.getElementById("rateN").textContent=total?Math.round(p/total*100)+"%":"0%";document.getElementById("bar").style.width=total?Math.round(p/total*100)+"%":"0%";
 let out="";Object.entries(grouped()).forEach(([g,ns])=>{if(!ns.length)return;let open=openGroups.has(g);let got=ns.filter(x=>getStatus(x.id)==="present").length;
 out+=`<div class="instrument"><button class="instrument-head" onclick="toggleGroup('${esc(g)}')"><div class="inst-left"><span class="chev">${open?"⌄":"›"}</span><span class="inst-name">${g}</span><span class="count">${ns.length} 人</span></div><span class="count">${got} 已到</span></button>`;
 if(open){out+='<div class="people">';ns.forEach(x=>{let s=getStatus(x.id),a=attendance[x.id],note=a?.note||"";out+=`<div class="person"><div class="name">${esc(x.name)}${x.part?`<span class="role">${esc(x.part)}</span>`:""}<span class="role">${esc(x.role)}</span></div>
 <label class="att-box"><input type="checkbox" ${s==="present"?"checked":""} onchange="setStatus(${x.id},this.checked?'present':'absent')"> 簽到</label>
 <label class="att-box leave-box"><input type="checkbox" ${s==="leave"?"checked":""} onchange="setStatus(${x.id},this.checked?'leave':'absent')"> 請假</label>
 <button class="small-btn" onclick="openNote(${x.id})">備註</button>${note?`<div class="note">📝 ${esc(note)}</div>`:""}</div>`});out+="</div>"}out+="</div>"});
 document.getElementById("instruments").innerHTML=out||'<div class="empty">目前沒有符合條件的人員。</div>';
}
async function setStatus(personId,status){
 const existing=attendance[personId];
 let payload={course_id:currentDateId,person_id:personId,status, note:existing?.note||"",updated_at:new Date().toISOString()};
 const {data,error}=await sb.from("attendance").upsert(payload,{onConflict:"course_id,person_id"}).select().single();
 if(error){console.error(error);toast("儲存失敗");render();return}
 attendance[personId]=data;render();
}
function toggleGroup(g){if(openGroups.has(g))openGroups.delete(g);else openGroups.add(g);render()}
function setRole(r,b){currentRole=r;document.querySelectorAll("#roleFilters .filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function openNote(id){noteTarget=id;let p=people.find(x=>x.id===id);document.getElementById("noteTitle").textContent=(p?.name||"")+"｜特殊狀況備註";document.getElementById("noteText").value=attendance[id]?.note||"";document.getElementById("noteModal").classList.add("show")}
function closeNote(){document.getElementById("noteModal").classList.remove("show")}
async function saveNote(){let existing=attendance[noteTarget],payload={course_id:currentDateId,person_id:noteTarget,status:existing?.status||"absent",note:document.getElementById("noteText").value.trim(),updated_at:new Date().toISOString()};let {data,error}=await sb.from("attendance").upsert(payload,{onConflict:"course_id,person_id"}).select().single();if(error){toast("儲存失敗");return}attendance[noteTarget]=data;closeNote();render();toast("備註已儲存")}
function openLogin(){document.getElementById("loginError").textContent="";document.getElementById("loginModal").classList.add("show")}
function closeLogin(){document.getElementById("loginModal").classList.remove("show")}
async function login(){let email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;if(!email||!password){document.getElementById("loginError").textContent="請輸入 Email 與密碼";return}let {error}=await sb.auth.signInWithPassword({email,password});if(error){document.getElementById("loginError").textContent="登入失敗：Email 或密碼可能不正確";return}closeLogin();showAdmin();toast("管理員登入成功")}
async function logout(){await sb.auth.signOut();showMain();toast("已登出")}
function showAdmin(){document.getElementById("main").style.display="none";document.getElementById("admin").style.display="block";document.getElementById("adminBtn").style.display="none";document.getElementById("adminUserLabel").style.display="block";adminTab("courses",document.querySelector(".admin-tabs .filter"));renderAdminAll()}
function showMain(){document.getElementById("admin").style.display="none";document.getElementById("main").style.display="block";document.getElementById("adminBtn").style.display="block";document.getElementById("adminUserLabel").style.display="none"}
function adminTab(tab,b){document.querySelectorAll(".admin-tabs .filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");["courses","people","stats"].forEach(x=>document.getElementById("admin"+x[0].toUpperCase()+x.slice(1)).style.display=x===tab?"block":"none");if(tab==="people")renderPeopleAdmin();if(tab==="stats")renderStatsAdmin()}
function renderAdminAll(){renderDateAdmin();renderPeopleAdmin();renderStatsAdmin()}
function renderDateAdmin(){document.getElementById("dateAdmin").innerHTML=courses.map((c,i)=>`<div class="admin-row"><span>${esc(c.course_date)}</span><span><button class="small-btn" onclick="useDate(${c.id})">查看</button> <button class="small-btn" onclick="editDate(${c.id})">編輯</button> <button class="small-btn danger" onclick="removeDate(${c.id})">刪除</button></span></div>`).join("")||'<div class="empty">目前沒有課程</div>'}
async function addDate(){let d=document.getElementById("newDate").value.trim();if(!d)return;if(courses.some(c=>c.course_date===d))return alert("這個日期已存在");let max=Math.max(0,...courses.map(c=>c.sort_order));let {error}=await sb.from("courses").insert({course_date:d,sort_order:max+1});if(error){alert("新增失敗："+error.message);return}document.getElementById("newDate").value="";await loadAll();renderAdminAll();toast("課程已新增")}
async function editDate(id){let c=courses.find(x=>x.id===id);let d=prompt("修改課程日期",c.course_date);if(!d||d===c.course_date)return;let {error}=await sb.from("courses").update({course_date:d}).eq("id",id);if(error){alert("修改失敗："+error.message);return}await loadAll();renderAdminAll()}
async function removeDate(id){let c=courses.find(x=>x.id===id);if(!confirm("確定刪除「"+c.course_date+"」？該堂課的簽到資料也會一起刪除。"))return;let {error}=await sb.from("courses").delete().eq("id",id);if(error){alert("刪除失敗："+error.message);return}currentDateId=null;await loadAll();renderAdminAll()}
function useDate(id){currentDateId=id;showMain();loadAll()}
function populateGroupSelect(id){document.getElementById(id).innerHTML=instrumentOrder.map(g=>`<option>${g}</option>`).join("")}
function renderPeopleAdmin(){populateGroupSelect("personGroup");let rows="";people.forEach(p=>{rows+=`<div class="admin-row"><span><b>${esc(p.name)}</b> <span class="role">${esc(p.role)} · ${esc(p.instrument)}${p.part?" · "+esc(p.part):""}</span></span><span><button class="small-btn" onclick="movePerson(${p.id},-1)">↑</button> <button class="small-btn" onclick="movePerson(${p.id},1)">↓</button> <button class="small-btn" onclick="editPerson(${p.id})">編輯</button> <button class="small-btn danger" onclick="deletePerson(${p.id})">刪除</button></span></div>`});document.getElementById("peopleAdmin").innerHTML=rows||'<div class="empty">目前沒有資料</div>'}
async function addPerson(){let n=document.getElementById("personName").value.trim(),r=document.getElementById("personRole").value,g=document.getElementById("personGroup").value,part=document.getElementById("personPart").value.trim();if(!n||!g)return alert("請填寫姓名並選擇樂器分部");let maxOrder=Math.max(-1,...people.filter(x=>x.instrument===g).map(x=>Number(x.sort_order)||0));
 let {error}=await sb.from("people").insert({name:n,role:r,instrument:g,part,active:true,sort_order:maxOrder+1});if(error){alert("新增失敗："+error.message);return}document.getElementById("personName").value="";document.getElementById("personPart").value="";await loadAll();renderPeopleAdmin();toast("人員已新增")}
async function movePerson(id,direction){
 let p=people.find(x=>x.id===id);if(!p)return;
 let same=people.filter(x=>x.instrument===p.instrument).sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
 let i=same.findIndex(x=>x.id===id),j=i+direction;if(i<0||j<0||j>=same.length)return;
 let a=same[i],b=same[j],ao=a.sort_order??i,bo=b.sort_order??j;
 let {error}=await sb.from("people").update({sort_order:bo}).eq("id",a.id);if(error){alert("排序更新失敗："+error.message);return}
 let r=await sb.from("people").update({sort_order:ao}).eq("id",b.id);if(r.error){alert("排序更新失敗："+r.error.message);return}
 await loadAll();renderPeopleAdmin();toast("名單順序已更新");
}
function editPerson(id){let p=people.find(x=>x.id===id);document.getElementById("editId").value=id;document.getElementById("editName").value=p.name;document.getElementById("editRole").value=p.role;populateGroupSelect("editGroup");document.getElementById("editGroup").value=p.instrument;document.getElementById("editPart").value=p.part||"";document.getElementById("editModal").classList.add("show")}
function closeEdit(){document.getElementById("editModal").classList.remove("show")}
async function savePerson(){let id=Number(document.getElementById("editId").value),old=people.find(x=>x.id===id),newInstrument=document.getElementById("editGroup").value,payload={name:document.getElementById("editName").value.trim(),role:document.getElementById("editRole").value,instrument:newInstrument,part:document.getElementById("editPart").value.trim(),sort_order:old?.instrument===newInstrument?(old.sort_order??0):Math.max(-1,...people.filter(x=>x.instrument===newInstrument).map(x=>Number(x.sort_order)||0))+1};if(!payload.name)return alert("請填寫姓名");let {error}=await sb.from("people").update(payload).eq("id",id);if(error){alert("修改失敗："+error.message);return}closeEdit();await loadAll();renderPeopleAdmin();toast("人員已更新")}
async function deletePerson(id){let p=people.find(x=>x.id===id);if(!confirm("確定刪除「"+p.name+"」？歷史簽到紀錄也會刪除。"))return;let {error}=await sb.from("people").update({active:false}).eq("id",id);if(error){alert("刪除失敗："+error.message);return}await loadAll();renderPeopleAdmin();toast("人員已刪除")}
async function renderStatsAdmin(){let out='<table class="stats-table"><thead><tr><th>日期</th><th>已到</th><th>請假</th><th>未到</th><th>出席率</th></tr></thead><tbody>';if(!courses.length){document.getElementById("statsAdmin").innerHTML='<div class="empty">目前沒有課程</div>';return}for(const c of courses){let {data}=await sb.from("attendance").select("status").eq("course_id",c.id);let arr=data||[],p=arr.filter(x=>x.status==="present").length,l=arr.filter(x=>x.status==="leave").length,total=people.length,rate=total?Math.round(p/total*100):0;out+=`<tr><td>${esc(c.course_date)}</td><td>${p}</td><td>${l}</td><td>${total-p-l}</td><td>${rate}%</td></tr>`}out+='</tbody></table>';document.getElementById("statsAdmin").innerHTML=out}
sb.auth.onAuthStateChange((_event,session)=>{if(session){document.getElementById("adminBtn").style.display="none"}});
async function init(){await loadAll();let {data}=await sb.auth.getSession();if(data.session)showAdmin();refreshTimer=setInterval(async()=>{if(document.visibilityState==="visible"&&document.getElementById("main").style.display!=="none"){await loadAll()}},5000)}
init();
</script>
